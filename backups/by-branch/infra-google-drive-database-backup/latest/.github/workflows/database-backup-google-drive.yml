name: Database backup to Google Drive

on:
  workflow_dispatch:
  schedule:
    # 06:30 UTC = 03:30 America/Sao_Paulo (BRT)
    - cron: '30 6 * * *'

permissions:
  contents: read

concurrency:
  group: voto-forte-database-backup
  cancel-in-progress: false

jobs:
  backup:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.GDRIVE_BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BACKUP_DIR: /tmp/voto-forte-db-backup
      DRIVE_FOLDER_ID: 1LePlbjMOWjjiNG7EWFLYfZrDmRAWONkU
      DRIVE_TARGET: gdrive:
      RETENTION_DAYS: '30'

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo 'Missing secret: SUPABASE_DB_URL'; exit 1; }
          test -n "$GDRIVE_SERVICE_ACCOUNT_JSON" || { echo 'Missing secret: GDRIVE_SERVICE_ACCOUNT_JSON'; exit 1; }

      - name: Install rclone
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone version
          docker pull postgres:17-alpine

      - name: Configure Google Drive service account
        shell: bash
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > /tmp/gdrive-service-account.json
          chmod 600 /tmp/gdrive-service-account.json

          cat > "$HOME/.config/rclone/rclone.conf" <<EOF
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/gdrive-service-account.json
          root_folder_id = ${DRIVE_FOLDER_ID}
          EOF
          chmod 600 "$HOME/.config/rclone/rclone.conf"

          rclone listremotes | grep -qx 'gdrive:'
          rclone lsf "$DRIVE_TARGET" >/dev/null

      - name: Create PostgreSQL 17 dump
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_DIR"
          TS="$(date -u '+%Y-%m-%dT%H-%M-%SZ')"
          FILE="votoforte-postgres-${TS}.dump"
          echo "BACKUP_FILE=$FILE" >> "$GITHUB_ENV"

          docker run --rm \
            -e SUPABASE_DB_URL \
            -e BACKUP_FILE="$FILE" \
            -v "$BACKUP_DIR:/backup" \
            postgres:17-alpine \
            sh -ec 'pg_dump \
              --dbname="$SUPABASE_DB_URL" \
              --format=custom \
              --compress=9 \
              --no-owner \
              --no-privileges \
              --file="/backup/$BACKUP_FILE"'

      - name: Validate dump integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s "$BACKUP_DIR/$BACKUP_FILE"

          docker run --rm \
            -e BACKUP_FILE="$BACKUP_FILE" \
            -v "$BACKUP_DIR:/backup" \
            postgres:17-alpine \
            sh -ec 'pg_restore --list "/backup/$BACKUP_FILE" > "/backup/$BACKUP_FILE.contents.txt"'

          test -s "$BACKUP_DIR/$BACKUP_FILE.contents.txt"
          sha256sum "$BACKUP_DIR/$BACKUP_FILE" > "$BACKUP_DIR/$BACKUP_FILE.sha256"

          SIZE_BYTES="$(stat -c '%s' "$BACKUP_DIR/$BACKUP_FILE")"
          ENTRY_COUNT="$(grep -vc '^;' "$BACKUP_DIR/$BACKUP_FILE.contents.txt" || true)"
          test "$SIZE_BYTES" -gt 1024 || { echo 'Backup unexpectedly small'; exit 1; }
          test "$ENTRY_COUNT" -gt 0 || { echo 'Backup contains no restore entries'; exit 1; }

          echo "BACKUP_SIZE_BYTES=$SIZE_BYTES" >> "$GITHUB_ENV"
          echo "BACKUP_ENTRY_COUNT=$ENTRY_COUNT" >> "$GITHUB_ENV"
          echo "Backup validated: $BACKUP_FILE ($SIZE_BYTES bytes, $ENTRY_COUNT restore entries)"

      - name: Upload backup to Google Drive
        shell: bash
        run: |
          set -euo pipefail
          rclone copyto \
            "$BACKUP_DIR/$BACKUP_FILE" \
            "$DRIVE_TARGET$BACKUP_FILE" \
            --retries 5 \
            --low-level-retries 10 \
            --checkers 4 \
            --transfers 1

          rclone copyto \
            "$BACKUP_DIR/$BACKUP_FILE.sha256" \
            "$DRIVE_TARGET$BACKUP_FILE.sha256" \
            --retries 5

      - name: Verify uploaded backup
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_SIZE="$(stat -c '%s' "$BACKUP_DIR/$BACKUP_FILE")"
          REMOTE_SIZE="$(rclone size "$DRIVE_TARGET$BACKUP_FILE" --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["bytes"])')"

          test "$LOCAL_SIZE" = "$REMOTE_SIZE" || {
            echo "Upload verification failed: local=$LOCAL_SIZE remote=$REMOTE_SIZE"
            exit 1
          }

          rclone cat "$DRIVE_TARGET$BACKUP_FILE.sha256" | grep -Fq "$(sha256sum "$BACKUP_DIR/$BACKUP_FILE" | cut -d' ' -f1)"
          echo "Google Drive upload verified: $BACKUP_FILE ($REMOTE_SIZE bytes)"

      - name: Apply 30-day retention
        shell: bash
        run: |
          set -euo pipefail
          rclone delete "$DRIVE_TARGET" \
            --min-age "${RETENTION_DAYS}d" \
            --include 'votoforte-postgres-*.dump' \
            --include 'votoforte-postgres-*.dump.sha256' || true

      - name: Write backup summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Voto Forte — Database Backup'
            echo
            echo "- Run: ${{ github.run_id }}"
            echo "- Time (UTC): $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo '- Destination: Google Drive / Voto Forte / Backups / PostgreSQL'
            if [ -n "${BACKUP_FILE:-}" ] && [ -f "$BACKUP_DIR/$BACKUP_FILE" ]; then
              echo "- File: $BACKUP_FILE"
              echo "- Size: $(du -h "$BACKUP_DIR/$BACKUP_FILE" | cut -f1)"
              echo "- Restore entries: ${BACKUP_ENTRY_COUNT:-unknown}"
              echo '- Local dump validation: OK'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
