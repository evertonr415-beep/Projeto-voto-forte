name: Check backup credentials 2026-09-16

on:
  push:
    branches:
      - backup/manual-db-snapshot-20260916
    paths:
      - .github/workflows/check-backup-credentials-20260916.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check recovery credentials without exposing values
        shell: bash
        env:
          SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          found=0
          for pair in \
            "SUPABASE_SERVICE_ROLE_KEY:$SERVICE_ROLE" \
            "SUPABASE_SERVICE_KEY:$SERVICE_KEY" \
            "SUPABASE_SECRET_KEY:$SECRET_KEY" \
            "SUPABASE_ACCESS_TOKEN:$ACCESS_TOKEN"
          do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -n "$value" ]; then
              echo "$name=AVAILABLE"
              found=1
            else
              echo "$name=MISSING"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo 'NO_RECOVERY_API_CREDENTIAL_AVAILABLE'
          fi
