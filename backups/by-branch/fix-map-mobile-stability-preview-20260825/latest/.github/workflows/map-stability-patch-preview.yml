name: Apply map stability preview patch

on:
  push:
    branches:
      - fix/map-mobile-stability-preview-20260825
    paths:
      - .github/workflows/map-stability-patch-preview.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/map-mobile-stability-preview-20260825
          fetch-depth: 0

      - name: Keep Leaflet map stable across data updates
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/dashboard-client.tsx")
          source = path.read_text()

          old_refs = '''  const mapElement = useRef<HTMLDivElement>(null);\n  const mapInstance = useRef<any>(null);\n  const contactLayer = useRef<any>(null);\n  const [locating, setLocating] = useState(false);'''
          new_refs = '''  const mapElement = useRef<HTMLDivElement>(null);\n  const mapInstance = useRef<any>(null);\n  const contactLayer = useRef<any>(null);\n  const contactsRef = useRef(contacts);\n  const meetingsRef = useRef(meetings);\n  contactsRef.current = contacts;\n  meetingsRef.current = meetings;\n  const [locating, setLocating] = useState(false);'''

          old_render = '''      contactLayer.current = L.layerGroup().addTo(map);\n      renderMapMarkers(L, contactLayer.current, contacts, meetings);'''
          new_render = '''      contactLayer.current = L.layerGroup().addTo(map);\n      renderMapMarkers(\n        L,\n        contactLayer.current,\n        contactsRef.current,\n        meetingsRef.current,\n      );'''

          old_dependency = '''  }, [contacts, meetings]);\n\n  useEffect(() => {\n    const L = (window as any).L,\n      layer = contactLayer.current;'''
          new_dependency = '''  }, []);\n\n  useEffect(() => {\n    const L = (window as any).L,\n      layer = contactLayer.current;'''

          replacements = [
              (old_refs, new_refs, "map refs"),
              (old_render, new_render, "initial marker render"),
              (old_dependency, new_dependency, "map lifecycle dependency"),
          ]
          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label} match, found {count}")
              source = source.replace(old, new, 1)

          path.write_text(source)

      - name: Remove temporary workflow and commit patch
        run: |
          git config user.name "Voto Forte Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/map-stability-patch-preview.yml
          git add app/dashboard-client.tsx
          git commit -m "fix(map): manter instancia Leaflet durante atualizacoes"
          git push origin HEAD:fix/map-mobile-stability-preview-20260825
