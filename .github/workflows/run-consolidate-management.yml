name: Aplicar consolidacao de Gestao

on:
  push:
    paths:
      - ".github/scripts/consolidate-management.py"
      - ".github/workflows/run-consolidate-management.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar transformacao
        run: python3 .github/scripts/consolidate-management.py
      - name: Verificar resultado
        shell: bash
        run: |
          ! grep -q '"Gestão"' app/dashboard-client.tsx
          grep -q 'aria-label="Filtrar contatos"' app/dashboard-client.tsx
          grep -q 'action="+ Novo cadastro"' app/dashboard-client.tsx
      - name: Publicar e limpar rotina temporaria
        shell: bash
        run: |
          rm -f .github/scripts/consolidate-management.py
          rm -f .github/workflows/run-consolidate-management.yml
          git config user.name "Voto Forte Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/dashboard-client.tsx .github/scripts/consolidate-management.py .github/workflows/run-consolidate-management.yml
          git diff --cached --check
          git commit -m "consolida gestao em contatos"
          git push origin HEAD:main
