name: Corrigir handshake do Mapa Eleitoral

on:
  push:
    paths:
      - ".github/scripts/fix-electoral-map-handshake.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar handshake deterministico
        run: python3 .github/scripts/fix-electoral-map-handshake.py
      - name: Validar preservacao do mapa moderno
        shell: bash
        run: |
          grep -q 'voto-forte:base-electoral-map-ready' app/dashboard-client.tsx
          grep -q 'voto-forte:base-electoral-map-ready' app/map-contact-layer.tsx
          grep -q '__vfBaseElectoralMap' app/dashboard-client.tsx
          grep -q '__vfBaseElectoralMap' app/map-contact-layer.tsx
          grep -q 'voto-forte:electoral-map-ready' app/map-contact-layer.tsx
          grep -q 'className: "contact-pin"' app/dashboard-client.tsx
          grep -q 'className: "vf-map-person"' app/map-contact-layer.tsx
          grep -q 'vf-district-point-icon' app/map-territory-enhancer.tsx
          grep -q 'const MAP_LAYOUT_QUERY = "(min-width: 0px)"' app/mobile-map-controls.tsx
          ! grep -q 'className="panel territorial"' app/dashboard-client.tsx
      - name: Publicar e limpar rotina temporaria
        shell: bash
        run: |
          rm -f .github/scripts/fix-electoral-map-handshake.py
          rm -f .github/workflows/run-fix-electoral-map-handshake.yml
          git config user.name "Voto Forte Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/dashboard-client.tsx app/map-contact-layer.tsx .github/scripts/fix-electoral-map-handshake.py .github/workflows/run-fix-electoral-map-handshake.yml
          git diff --cached --check
          git commit -m "estabiliza inicializacao do mapa eleitoral moderno"
          git push origin HEAD:main
