name: Total de contatos no zoom afastado

on:
  push:
    paths:
      - ".github/scripts/add-map-overview-total.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar total no zoom afastado
        run: python3 .github/scripts/add-map-overview-total.py
      - name: Validar alteracao isolada
        shell: bash
        run: |
          grep -q 'vf-district-overview-total' app/map-territory-enhancer.tsx
          grep -q 'const isOverviewZoom = zoom <= 12' app/map-territory-enhancer.tsx
          grep -q 'summaryPayload.total' app/map-territory-enhancer.tsx
          grep -q 'overviewMarker.setLatLng(map.getCenter())' app/map-territory-enhancer.tsx
          grep -q 'className: "vf-district-point-icon"' app/map-territory-enhancer.tsx
          grep -q 'draggable: canManageReferences' app/map-territory-enhancer.tsx
          grep -q 'voto-forte:open-district-contacts' app/map-territory-enhancer.tsx
          grep -q 'voto-forte:electoral-map-ready' app/map-territory-enhancer.tsx
      - name: Publicar e limpar rotina temporaria
        shell: bash
        run: |
          rm -f .github/scripts/add-map-overview-total.py
          rm -f .github/workflows/run-map-overview-total.yml
          git config user.name "Voto Forte Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/map-territory-enhancer.tsx .github/scripts/add-map-overview-total.py .github/workflows/run-map-overview-total.yml
          git diff --cached --check
          git commit -m "mostra total de contatos no zoom afastado do mapa"
          git push origin HEAD:main
