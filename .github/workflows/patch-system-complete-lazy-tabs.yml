name: Patch System Complete Lazy Tabs

on:
  push:
    branches:
      - perf/system-complete-lazy-tabs-20260818
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/system-complete-lazy-tabs-20260818
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Apply guarded patch
        run: python .github/scripts/patch_lazy_system_tabs.py
      - name: Verify changed client
        run: |
          npm ci
          npm run lint -- --quiet
          npm run build
      - name: Commit patched client
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard-client.tsx
          git diff --cached --exit-code && exit 0
          git commit -m "perf: lazy-load Sistema Completo tabs"
          git push origin HEAD:perf/system-complete-lazy-tabs-20260818
