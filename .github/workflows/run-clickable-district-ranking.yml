name: Atalho de bairros no painel de contatos

on:
  push:
    paths:
      - ".github/scripts/add-clickable-district-ranking.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar atalho por bairro
        run: python3 .github/scripts/add-clickable-district-ranking.py
      - name: Validar integracao
        shell: bash
        run: |
          grep -q 'voto-forte:filter-district-contacts' app/contact-district-ranking.tsx
          grep -q 'voto-forte:filter-district-contacts' app/neutral-dashboard-client.tsx
          grep -q 'params.set("district", districtFilter)' app/neutral-dashboard-client.tsx
          grep -q 'setDistrictFilter("")' app/neutral-dashboard-client.tsx
          grep -q 'Bairro:' app/neutral-dashboard-client.tsx
          grep -q 'onClick={() => openDistrict(item.district)}' app/contact-district-ranking.tsx
          grep -q 'onClick={() => setEditing(contact)}' app/neutral-dashboard-client.tsx
          grep -q 'vf_contacts_for_district' app/api/contacts/route.ts
      - name: Publicar e limpar rotina temporaria
        shell: bash
        run: |
          rm -f .github/scripts/add-clickable-district-ranking.py
          rm -f .github/workflows/run-clickable-district-ranking.yml
          git config user.name "Voto Forte Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/contact-district-ranking.tsx app/neutral-dashboard-client.tsx .github/scripts/add-clickable-district-ranking.py .github/workflows/run-clickable-district-ranking.yml
          git diff --cached --check
          git commit -m "abre contatos ao clicar no bairro do painel"
          git push origin HEAD:main
