name: Remover sair do painel de contatos

on:
  push:
    paths:
      - ".github/scripts/remove-contacts-logout.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remover botao sair do painel
        run: python3 .github/scripts/remove-contacts-logout.py
      - name: Validar alteracao isolada
        shell: bash
        run: |
          grep -q 'import { apiFetch } from "./supabase-client";' app/neutral-dashboard-client.tsx
          ! grep -q 'className="optimized-logout"' app/neutral-dashboard-client.tsx
          grep -q 'className="optimized-scope-control"' app/neutral-dashboard-client.tsx
          grep -q 'Todos os usuários' app/neutral-dashboard-client.tsx
          grep -q 'onClick={() => setEditing(contact)}' app/neutral-dashboard-client.tsx
          grep -q 'params.set("district", districtFilter)' app/neutral-dashboard-client.tsx
      - name: Publicar e limpar rotina temporaria
        shell: bash
        run: |
          rm -f .github/scripts/remove-contacts-logout.py
          rm -f .github/workflows/run-remove-contacts-logout.yml
          git config user.name "Voto Forte Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/neutral-dashboard-client.tsx .github/scripts/remove-contacts-logout.py .github/workflows/run-remove-contacts-logout.yml
          git diff --cached --check
          git commit -m "remove sair do painel de contatos"
          git push origin HEAD:main
