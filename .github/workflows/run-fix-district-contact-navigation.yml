name: Corrigir contatos por bairro

on:
  push:
    paths:
      - ".github/scripts/fix-district-contact-navigation.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Integrar lista territorial completa
        run: python3 .github/scripts/fix-district-contact-navigation.py
      - name: Validar integracao
        shell: bash
        run: |
          grep -q 'scope={scope}' app/dashboard-client.tsx
          grep -q 'districtContacts' app/dashboard-client.tsx
          grep -q '/api/contacts?' app/dashboard-client.tsx
          grep -q 'districtTotal' app/dashboard-client.tsx
          grep -q 'Página' app/dashboard-client.tsx
          grep -q 'vf_contacts_for_district' app/api/contacts/route.ts
          grep -q 'p_district' app/api/contacts/route.ts
          ! grep -q 'className="panel territorial"' app/dashboard-client.tsx
      - name: Publicar e limpar rotina temporaria
        shell: bash
        run: |
          rm -f .github/scripts/fix-district-contact-navigation.py
          rm -f .github/workflows/run-fix-district-contact-navigation.yml
          git config user.name "Voto Forte Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/dashboard-client.tsx .github/scripts/fix-district-contact-navigation.py .github/workflows/run-fix-district-contact-navigation.yml
          git diff --cached --check
          git commit -m "abre contatos completos do bairro selecionado no mapa"
          git push origin HEAD:main
