name: Patch hierarchy observer

on:
  push:
    branches:
      - stabilize/post118-runtime-20260818

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/post118-runtime-20260818
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python .github/scripts/patch_hierarchy_observer.py
      - run: npx eslint app/user-hierarchy-remount-guard.tsx app/user-hierarchy-panel.tsx --quiet --rule 'react-hooks/set-state-in-effect: 0'
      - run: npx vinext build
      - name: Commit patch
        run: |
          if git diff --quiet -- app/user-hierarchy-panel.tsx; then
            echo 'No patch needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/user-hierarchy-panel.tsx
          git commit -m 'refactor: consolidate hierarchy host observer'
          git push origin HEAD:stabilize/post118-runtime-20260818
