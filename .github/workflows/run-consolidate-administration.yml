name: Consolidar area administrativa

on:
  push:
    paths:
      - ".github/scripts/consolidate-administration.py"
      - ".github/workflows/run-consolidate-administration.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Aplicar consolidacao
        run: python3 .github/scripts/consolidate-administration.py

      - name: Verificar referencias
        shell: bash
        run: |
          ! grep -q '| "Usuários"' app/dashboard-client.tsx
          ! grep -q '| "Banco de Dados e Backup"' app/dashboard-client.tsx
          grep -q '| "Administração"' app/dashboard-client.tsx
          grep -q 'function Administration' app/dashboard-client.tsx
          grep -q 'Usuários e acessos' app/dashboard-client.tsx
          grep -q 'Atividades / Auditoria' app/dashboard-client.tsx
          grep -q 'Banco de Dados e Backup' app/dashboard-client.tsx

      - name: Publicar e limpar rotina temporaria
        shell: bash
        run: |
          rm -f .github/scripts/consolidate-administration.py
          rm -f .github/workflows/run-consolidate-administration.yml
          git config user.name "Voto Forte Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/dashboard-client.tsx .github/scripts/consolidate-administration.py .github/workflows/run-consolidate-administration.yml
          git diff --cached --check
          git commit -m "consolida area administrativa"
          git push origin HEAD:main
